<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 净化器 · 前后对照</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --panel2: #1f2330; --line: #2a2f3d;
    --fg: #e6e9ef; --muted: #8b93a7; --accent: #5b9dff; --good: #3ecf8e;
    --bad: #ff6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 6px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 24px 28px 60px; max-width: 1280px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card h2 { margin: 0; padding: 12px 16px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel2); }
  textarea, pre {
    width: 100%; margin: 0; border: 0; outline: none; resize: vertical;
    background: transparent; color: var(--fg); font-family: var(--mono);
    font-size: 13px; line-height: 1.55; padding: 14px 16px;
  }
  textarea { min-height: 260px; }
  pre { min-height: 260px; max-height: 480px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .controls { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; align-items: center; }
  button {
    background: var(--accent); color: #08101f; border: 0; border-radius: 8px;
    padding: 9px 18px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.secondary { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
  .badge { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; }
  .badge.good { background: rgba(62,207,142,.14); color: var(--good); }
  .badge.bad { background: rgba(255,107,107,.14); color: var(--bad); }
  .stats { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
  .full { grid-column: 1 / -1; }
  .rendered { padding: 14px 16px; min-height: 60px; background: #fff; color: #111; border-radius: 0 0 12px 12px; }
  .rendered img { max-width: 120px; }
  .muted { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>HTML 净化器 · 净化前后对照</h1>
  <p>基于 WHATWG HTML 标准自研 tokenizer + 树构造（含 SVG/MathML 命名空间），白名单过滤 + mXSS 安全序列化。所有处理在浏览器本地完成，不上传任何内容。</p>
</header>
<main>
  <div class="controls">
    <button id="run">运行净化</button>
    <button id="load-attack" class="secondary">载入攻击样本</button>
    <button id="copy" class="secondary">复制净化结果</button>
    <span id="findings" class="badge good"></span>
    <span id="stats" class="stats"></span>
  </div>

  <div class="grid">
    <section class="card">
      <h2>输入 · 不可信 HTML</h2>
      <textarea id="input" spellcheck="false"></textarea>
    </section>
    <section class="card">
      <h2>输出 · 净化后 HTML（转义文本）</h2>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </section>

    <section class="card full">
      <h2>输出的真实渲染效果（在沙箱化容器中展示，已无脚本）</h2>
      <div id="rendered" class="rendered"></div>
    </section>

    <section class="card full">
      <h2>净化后的树结构（标注命名空间）</h2>
      <pre id="tree"></pre>
    </section>
  </div>
  <p class="muted">提示：可粘贴任意评论 HTML，点击「运行净化」查看标签/属性如何被过滤、危险 URL 与 CSS 如何被拦截，以及命名空间如何切换。</p>
</main>
<script src="./sanitizer-demo.bundle.js"></script>
<script>
  // Render the sanitized output into a sandboxed iframe-free container. The
  // markup is already safe; this just demonstrates it renders as intended.
  const out = document.getElementById('output');
  const rendered = document.getElementById('rendered');
  const sync = () => { rendered.innerHTML = out.value; };
  out.addEventListener('input', sync);
  document.getElementById('run').addEventListener('click', () => setTimeout(sync, 0));
  document.getElementById('copy').addEventListener('click', () => setTimeout(sync, 0));
  document.getElementById('load-attack').addEventListener('click', () => setTimeout(sync, 0));
  sync();
</script>
</body>
</html>
